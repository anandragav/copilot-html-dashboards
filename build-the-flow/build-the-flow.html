.endnav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

}

<script>
(function(){
'use strict';
var RM=false;try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var INK='#03274A',MED='#164C80',PAPER='#fffef8',YEL='#FFD633',OK='#417B5A',GREY='#8c8c89';
var A='\u2192',DOT='\u00B7',TICK='\u2713',LOOP='\u21BB';
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}

/* ---------- content (from the flow sketch) ---------- */
var S=[
{crumb:['Start','Create export'],kind:'node',x:0,y:0,icon:'\u25B6',iconBg:MED,title:'Trigger',sub:'Manual now, scheduled later',tag:'START',conn:[],part:0,
 k:'Trigger',what:'Every flow starts with a trigger: use a **manual trigger** while you build and test.',
 cfg:[['Type','Manually trigger a flow (while testing)'],['Later','A scheduled trigger for regular imports']],
 why:'This is the start of the whole job: getting each new Pulsewire mention into the SharePoint list exactly once. While you build, a manual trigger lets you run the flow on demand and watch every step. Once the flow is proven, you swap it for a schedule so new mentions arrive without anyone pressing Run. Either way, the next step asks Pulsewire for the mentions.',
 tip:'Click the + under the trigger to add the first action. The arrow keys work too.'},
{crumb:['Trigger','Initialize status'],kind:'node',x:0,y:130,icon:'{ }',iconBg:INK,title:'Create Pulsewire export',sub:'POST /v1/exports',conn:[[0,33,0,97]],part:0,
 k:'HTTP '+DOT+' Pulsewire API',what:'Ask Pulsewire to start a one-time export of the mentions you want.',
 cfg:[['Method','`POST`'],['Path','`/v1/exports`'],['Body','Search ID + date window + `api.json`'],['Returns','A new export **ID**']],
 why:'The trigger only started the run; we still have no mentions. Pulsewire does not hand them over right away, so we ask it to build an export, and it replies with an export **ID** (a job number). Every POST starts a brand-new export with its own ID, so the rest of this run tracks that ID. Next we need a way to keep track of whether the export is ready.',
 tip:'Keep an eye on that returned ID. Guardrail 1 depends on it.'},
{crumb:['Create export','Do until'],kind:'node',x:0,y:260,icon:'x',iconBg:'#5b4a8a',title:'Initialize status',sub:'PulsewireExportStatus = PENDING',conn:[[0,163,0,227]],part:0,
 k:'Variables '+DOT+' Initialize variable',what:'Create a text variable that holds the export status, starting at `PENDING`.',
 cfg:[['Name','`PulsewireExportStatus`'],['Type','String'],['Value','`PENDING`']],
 why:'We now have an export ID, but Pulsewire is still building the export. The loop coming next needs a value to watch, and a variable has to exist before a loop can read or change it. It starts at PENDING because nothing is ready yet. The loop will update it until it says FINISHED.'},
{crumb:['Initialize status','Wait (inside the loop)'],kind:'loop',x:0,y:345,box:[-230,345,460,455],label:LOOP+'  Do until status = FINISHED',title:'Do until status = FINISHED',conn:[[0,293,0,345]],part:0,
 focus:{x:0,y:400,w:540,h:250},
 k:'Control '+DOT+' Do until',what:'Repeat the three actions inside the dashed box until the export status is FINISHED.',
 cfg:[['Loop until','`PulsewireExportStatus` is equal to `FINISHED`'],['Inside','Wait '+A+' Get export status '+A+' Set status variable']],
 why:'Pulsewire gave us an export ID in step 2, but the job is still running, so the data is not ready yet. We cannot download it until it says FINISHED, so we repeat everything inside this box (wait, check, store the status) until the status changes to FINISHED. Then the flow can move on to download the data.',
 tip:'Everything inside the dashed box runs once per lap.'},
{crumb:['Do until: new lap','Get export status'],kind:'node',x:0,y:430,icon:'30s',iconBg:'#7a6200',title:'Wait 30 seconds',sub:'Delay: 30 seconds',conn:[[0,362,0,397]],part:0,
 k:'Schedule '+DOT+' Delay',what:'Pause for 30 seconds at the start of every lap of the loop.',
 cfg:[['Count','30'],['Unit','Second']],
 why:'Each lap starts here, while the export is still being built. If we checked again right away, we would flood the API with requests that all say PENDING. A short pause gives Pulsewire time to work. After the pause, the next step asks for the status.'},
{crumb:['Wait 30 seconds','Set status variable'],kind:'node',x:0,y:560,icon:'{ }',iconBg:INK,title:'Get export status',sub:'GET /v1/exports/{id}',guard:[1,'Dynamic export ID'],conn:[[0,463,0,527]],part:0,
 k:'HTTP '+DOT+' Pulsewire API',what:'Ask Pulsewire for the current status of this run\'s export.',
 quiz:{ask:'The GET needs an export ID in its path. Which one should it use?',opts:[
  {t:'The ID I copied from my first test export',ok:false,fb:'That export is old. Every POST creates a new export, so a hard-coded ID would keep checking the wrong one.'},
  {t:'The ID returned by step 2 in this run',ok:true,fb:'Each run follows its own export, picked from step 2\'s output.'}]},
 cfg:[['Method','`GET`'],['Path','`/v1/exports/{export ID}`'],['Export ID','Dynamic: the ID returned by step 2 in this run']],
 why:'After the pause we still do not know whether the export is ready, so we ask. The request uses the export ID that step 2 returned in this same run, because every run creates a new export. The response says PENDING or FINISHED and, once finished, where to download the data. Next we store that status so the loop can see it.'},
{crumb:['Get export status','Next lap, or Download'],kind:'node',x:0,y:690,icon:'x',iconBg:'#5b4a8a',title:'Set status variable',sub:'body '+A+' export.status',guard:[2,'Real Pulsewire status'],conn:[[0,593,0,657]],part:0,
 focus:{x:20,y:715,w:540,h:250},
 k:'Variables '+DOT+' Set variable',what:'Copy Pulsewire\'s own export status into the variable the loop is watching.',
 quiz:{ask:'Which value should the loop read?',opts:[
  {t:'The HTTP statusCode of the GET',ok:false,fb:'statusCode is 200 as soon as the request itself succeeds, even while the export is still PENDING. The loop would stop too early.'},
  {t:'body '+A+' export.status',ok:true,fb:'That is Pulsewire\'s real export status: PENDING or FINISHED.'}]},
 cfg:[['Name','`PulsewireExportStatus`'],['Value','body '+A+' `export.status`'],['Result','`PENDING` or `FINISHED`'],['Not','HTTP `statusCode`']],
 why:'The status check gave us a response, but the loop only watches our status variable, so we copy the export status from the response body into it. PENDING sends the loop round again (wait, check, store). FINISHED ends the loop, and the flow moves on to download the data.',
 tip:'Watch the loop on the canvas. Click the status pill to run it again.'},
{crumb:['Do until: FINISHED','Select the fields'],kind:'node',x:0,y:890,icon:'{ }',iconBg:INK,title:'Download export data',sub:'GET data_url '+A+' documents[]',tag:'FINISHED '+TICK,conn:[[0,800,0,857]],part:0,
 k:'HTTP '+DOT+' Pulsewire API',what:'Download the finished export: a `documents[]` list of mentions.',
 cfg:[['Method','`GET`'],['URL','The returned `data_url`'],['Response','A `documents[]` array of Pulsewire mentions']],
 why:'The loop has ended, so we know the export is FINISHED, and the status response gave us a `data_url` that says where it is. Until now we only had status updates, not the mentions themselves. This call fetches them as a `documents[]` array (a list with one entry per mention). Next we trim that list down to what SharePoint needs.'},
{crumb:['Download','Apply to each'],kind:'node',x:0,y:1020,icon:'\u2261',iconBg:'#2f6b6b',title:'Select the fields',sub:'7 fields per document',conn:[[0,923,0,987]],part:1,
 k:'Data operation '+DOT+' Select',what:'Keep only the 7 fields the list needs from each document.',
 cfg:[['From','`documents[]`'],['Fields','Title, Description, Channel, URL, Pulsewire ID, Published Date & Time, Content Type']],
 why:'The download gave us a big `documents[]` array, and each document has far more fields than the Content Planner list uses. Select picks just the 7 the list needs, so every mention has the same small, predictable shape. That keeps the SharePoint steps simple to set up. Next we go through the mentions one by one.'},
{crumb:['Select the fields','Get items by ID'],kind:'loop',x:0,y:1105,box:[-370,1105,740,455],label:LOOP+'  Apply to each document',title:'Apply to each document',counter:true,conn:[[0,1053,0,1105]],part:1,
 focus:{x:0,y:1150,w:800,h:230},
 k:'Control '+DOT+' Apply to each',what:'Run the steps inside this box once for every mention.',
 cfg:[['Input','The output of Select'],['Test run','**64 documents**']],

  if(!review)focusRegion(region(i),600,i);
  else if(!fitsNow())focusRegion(region(i),RM?0:560,i);
}
function openOverview(){
  cardIdx=-2;var h='<div class="chead"><div class="t"><div class="kick">Overview</div><h2>The whole flow</h2></div><button type="button" class="minbtn" data-act="min" aria-label="Collapse or expand the card">\u2013</button></div><div class="cbody"><p>Fourteen steps in three parts. Click any step on the canvas, or a button below, to open its card.</p><ul class="ov">';
  PARTS.forEach(function(p,pi){h+='<li><b>'+(pi+1)+' '+DOT+' '+esc(p)+'</b>';S.forEach(function(s,i){if(s.part===pi)h+='<button type="button" data-act="goto" data-i="'+i+'">'+esc(s.title)+'</button>';});h+='</li>';});
  h+='</ul></div><div class="cnav"><button type="button" data-act="replay">\u21BB Build it step by step</button><button type="button" class="primary" data-act="finish">Summary '+A+'</button></div>';
  cin.innerHTML=h;card.classList.remove('min');glide=null;pop();setHL(-1);place();
}
function setHL(i){
  gSteps.selectAll('.hl').selectAll('*').remove();
  var hl=gSteps.select('.step[data-i="'+i+'"] .hl');if(hl.empty())return;
  var d=hl.datum(),p=ink(hl,hachure(rng(99+i),d.x,d.y,d.w,d.h,7),YEL,2.2).attr('opacity',0.75);
  if(!RM){var L=p.node().getTotalLength();p.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().duration(700).attr('stroke-dashoffset',0);}
}
function answer(i,k){
  var s=S[i],o=s.quiz.opts[k];answered[i]={o:k};
  var bs=cin.querySelectorAll('.opts button');
  for(var j=0;j<bs.length;j++){bs[j].disabled=true;if(s.quiz.opts[j].ok)bs[j].classList.add('right');else if(j===k)bs[j].classList.add('wrong');}
  cin.querySelector('.fb').innerHTML=(o.ok?'<b class="y">'+TICK+' Right.</b> ':'<b class="n">Not quite.</b> ')+fmt(o.fb);
  var rv=cin.querySelector('.reveal');if(rv)rv.classList.remove('hide');
  cin.querySelector('.cnav').outerHTML=navHtml(i);
  renderPlus(0);update();inkCard();
  if(isPhone())focusRegion(region(i),400,i);
}
cin.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.hasAttribute('data-o')){answer(cardIdx,+b.getAttribute('data-o'));return;}
  var a=b.getAttribute('data-act');
  if(a==='add')doAct({i:+b.getAttribute('data-i')});
  else if(a==='back')back();
  else if(a==='finish')doAct({finish:true});
  else if(a==='cur')openCard(last());
  else if(a==='fit'){fitAll();}
  else if(a==='goto')openCard(+b.getAttribute('data-i'));
  else if(a==='replay')replay();
  else if(a==='min'){toggleMin();}
});
function toggleMin(){if(card.hidden)return;card.classList.toggle('min');inkCard();if(isPhone()&&cardIdx>=0)focusRegion(region(cardIdx),300,cardIdx);}

/* ---------- end screen ---------- */
var end=$('end');
function showEnd(){
  if(order.length<N)return;
  var h='<div class="endin"><div class="eyebrow" style="color:#164C80">Summary</div><h2>You built the flow</h2><p class="endlead">Fourteen steps: create the export, wait for Pulsewire to finish, shape the data, check for duplicates, and create only new SharePoint list items. Three guardrails keep it reliable.</p><div class="guards">';
  GUARDS.forEach(function(g,k){h+='<div class="gcard"><svg class="gink" aria-hidden="true"></svg><span class="gnum">'+(k+1)+'</span><b>'+esc(g[0])+'</b><p>'+fmt(g[1])+'</p></div>';});
  h+='</div><div class="endgrid"><svg class="gink" aria-hidden="true"></svg><div><h3>Proven path in testing</h3><ul class="checks">';
  CHECKS.forEach(function(c,k){h+='<li><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="box" x="2" y="2" width="20" height="20" rx="3"></rect><path d="M6 12.5C7.5 14 8.6 15.3 10 17.2C12.6 12.6 15.4 9.4 19 6" style="animation-delay:'+(0.25+k*0.22).toFixed(2)+'s"></path></svg><span>'+esc(c)+'</span><span class="sr"> passed</span></li>';});
  h+='</ul></div><div id="chartwrap"><div class="chartbox"><canvas id="ft-chart" width="200" height="200" aria-label="Seven of seven proven-path checks passed" role="img"></canvas><div class="cc"><b>7/7</b><span>checks passed</span></div></div><div class="chartcap">One slice per check in the proven path</div></div></div>';
  h+='<div class="endnav"><button type="button" class="primary" data-e="replay">\u21BB Build it again</button><button type="button" data-e="back">\u2190 Back to the flow</button><button type="button" data-e="whole">Whole flow</button></div></div>';
  end.innerHTML=h;end.hidden=false;end.scrollTop=0;card.hidden=true;place();gUI.selectAll('*').remove();
  end.querySelectorAll('.gink').forEach(function(sv,k){var p=sv.parentNode,w=p.offsetWidth,hh=p.offsetHeight,d=d3.select(sv).attr('width',w).attr('height',hh);
    var pth=ink(d,rrect(rng(300+k),1.5,1.5,w-3,hh-3,0.8),INK,1.6);
    if(!RM){var L=pth.node().getTotalLength();pth.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().delay(k*180).duration(800).attr('stroke-dashoffset',0);}});
  if(chart){try{chart.destroy();}catch(e){}chart=null;}
  if(window.Chart){
    try{chart=new Chart($('ft-chart'),{type:'doughnut',data:{labels:CHECKS,datasets:[{data:[1,1,1,1,1,1,1],
      backgroundColor:['#03274A','#164C80','#417B5A','#FFD633','#036c70','#5b8fbf','#2f6b6b'],borderColor:'#fffef8',borderWidth:4,hoverOffset:6}]},
      options:{responsive:false,maintainAspectRatio:false,cutout:'64%',cutoutPercentage:64,animation:RM?false:{animateRotate:true,animateScale:false,duration:1400},
      layout:{padding:0},legend:{display:false},
      plugins:{legend:{display:false},tooltip:{enabled:true,callbacks:{label:function(c){var lab=c.label||(CHECKS[c.dataIndex!=null?c.dataIndex:c.index])||'';return ' '+lab+': passed';}}}}}});
      if(chart.options){if(chart.options.plugins&&chart.options.plugins.legend)chart.options.plugins.legend.display=false;if(chart.options.legend)chart.options.legend.display=false;}
      var cc=end.querySelector('.cc');if(cc&&chart.chartArea){var a=chart.chartArea;cc.style.left=((a.left+a.right)/2)+'px';cc.style.top=((a.top+a.bottom)/2)+'px';}
    }catch(e){console.warn('[flow-training] chart skipped',e);$('chartwrap').style.display='none';}
  }else{$('chartwrap').style.display='none';}
  setHash('done');update();try{end.focus({preventScroll:true});}catch(e){}
}
function hideEnd(){end.hidden=true;if(chart){try{chart.destroy();}catch(e){}chart=null;}renderPlus(0);openCard(last());}
end.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-e');if(a==='replay')replay();else if(a==='back')hideEnd();else if(a==='whole'){end.hidden=true;whole();}});

/* ---------- toolbar, keys, hash ---------- */
var dots=$('dots');for(var di=0;di<N;di++)dots.appendChild(document.createElement('i'));
function update(){
  var n=order.length,ds=dots.children;
  $('progtxt').textContent=(!end.hidden?'Done: ':'Step ')+n+' of '+N;
  for(var k=0;k<N;k++){ds[k].className=k<n-1?'on':(k===n-1?(end.hidden?'cur':'on'):'');}
  $('bBack').disabled=n<=1&&end.hidden;
  var a=actions()[0],b=$('bNext');
  b.textContent=a.finish?('Finish '+A):'Add step +';
  b.classList.toggle('locked',locked());b.disabled=!end.hidden;
}
$('bBack').addEventListener('click',back);
$('bNext').addEventListener('click',next);
$('bReplay').addEventListener('click',replay);
$('bWhole').addEventListener('click',whole);
$('bFit').addEventListener('click',fitAll);
document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='ArrowRight'){if(tag==='INPUT'||tag==='TEXTAREA')return;e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){if(tag==='INPUT'||tag==='TEXTAREA')return;e.preventDefault();back();}
  else if(e.key==='Escape'){toggleMin();}
});
function setHash(v){try{history.replaceState(null,'','#'+(v||('step='+order.length)));}catch(e){}}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(!card.hidden)inkCard();if(cardIdx>=0)focusRegion(region(cardIdx),0,cardIdx);else if(cardIdx===-2)fitAll();},150);});

var hs='';try{hs=location.hash||'';}catch(e){}
var m=/step=(\d+)/.exec(hs),want=hs.indexOf('done')>=0?N:(m?Math.max(1,Math.min(N,+m[1])):1);
if(want>1){
  var sq=seqAll().slice(0,want);
  sq.forEach(function(i,k){if(k<want-1||hs.indexOf('done')>=0)answered[i]={auto:true};order.push(i);drawStep(i,0);});
  update();renderPlus(0);openCard(last());
  if(hs.indexOf('done')>=0)showEnd();
}else{
  focusRegion(region(0),0);addStep(0);
}
window.__flowTraining={order:function(){return order.slice();},next:next,back:back,answer:function(k){if(cardIdx>=0&&S[cardIdx].quiz&&!answered[cardIdx])answer(cardIdx,k);},whole:whole,busy:function(){return Date.now()<busyUntil;},geom:function(){return geom?JSON.parse(JSON.stringify(geom)):null;},cardIdx:function(){return cardIdx;},gliding:function(){return !!glide;},open:function(i){openCard(i,true);}};
}
})();
</script>
</body></html>
